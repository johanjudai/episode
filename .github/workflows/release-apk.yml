name: release-apk

# Builds the Android APK.
#
#  - Push a `v*` tag (e.g. `git tag v0.1.0 && git push --tags`) → the
#    APK is RELEASE-signed (if the keystore secrets are configured)
#    and uploaded as a downloadable asset on the matching GitHub
#    Release, with auto-generated changelog.
#  - Push to `main` (every merge from staging) → an unsigned DEBUG
#    APK is uploaded as a workflow artifact (retention 30 days). Lets
#    you sideload the latest tip without making a formal release.
#  - Trigger manually from the Actions tab → same DEBUG-artifact
#    behaviour as a push to main.
#
# Signing:
#  - Only TAG pushes are eligible for the release-signed path. Other
#    triggers always produce a debug APK, so day-to-day merges don't
#    burn through release-signed builds.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      # Opt-in to the Node 24 runtime for JavaScript-based actions.
      # GitHub deprecated Node 20 (used by the v4/v3 actions below) and
      # will flip the default to Node 24 in June 2026; flipping it now
      # silences the runner annotation and verifies nothing breaks
      # ahead of the forced switch. Safe to drop once Node 24 is the
      # default for everyone.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: npm ci

      - name: Lint + type-check
        run: |
          npm run lint
          npm run check

      - name: Unit tests (hard gate)
        run: npm run test:unit -- --run

      - name: Build static SPA (local target)
        run: npm run build:local

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Resolve version
        id: version
        run: |
          # Tag pushes → use the tag name minus its leading `v`.
          # Manual runs → derive a dev label from the short SHA.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            TAG_LABEL="$GITHUB_REF_NAME"
          else
            VERSION_NAME="0.0.0-dev"
            TAG_LABEL="dev-${GITHUB_SHA::7}"
          fi

          # Build a monotonically-increasing versionCode from semver:
          #   MAJOR*10000 + MINOR*100 + PATCH  (so 1.2.3 → 10203).
          # Handles `1.2.3-anything` by stripping the suffix.
          CORE="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<<"$CORE"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [[ "$VERSION_CODE" -lt 1 ]] && VERSION_CODE=1

          echo "version_name=$VERSION_NAME"  | tee -a "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE"  | tee -a "$GITHUB_OUTPUT"
          echo "tag_label=$TAG_LABEL"        | tee -a "$GITHUB_OUTPUT"

      - name: Decode release keystore (tag pushes only)
        id: keystore
        # Only tag pushes get the signed-release treatment. Push-to-
        # main and manual dispatch always produce a debug APK so daily
        # merges from staging don't churn out signed builds.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" \
                && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded (signing release build)."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured — falling back to debug APK."
          fi

      - name: Build release-signed APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          # Pass secrets via environment, not as command-line args:
          # gradle's process arg list (`ps`, `/proc/*/cmdline`) would
          # otherwise contain the cleartext passwords briefly. GitHub
          # also auto-masks the values in workflow logs regardless.
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Build debug APK (fallback)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Rename & locate APK
        id: rename
        run: |
          if [[ "${{ steps.keystore.outputs.signed }}" == "true" ]]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          APK_NAME="episode-${{ steps.version.outputs.tag_label }}.apk"
          mv "$SRC" "$APK_NAME"
          ls -lh "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Cleanup keystore from runner
        if: always() && steps.keystore.outputs.signed == 'true'
        run: rm -f android/app/release.keystore

      - name: Upload as workflow artifact (push-to-main + manual)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_name }}
          retention-days: 30

      - name: Create / update GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Episode ${{ steps.version.outputs.tag_label }}
          files: ${{ steps.rename.outputs.apk_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            **Android APK** — `${{ steps.rename.outputs.apk_name }}`

            ${{ steps.keystore.outputs.signed == 'true' && '✅ **Release-signed.** Installs cleanly via the Android package installer.' || '⚠️ **Debug-signed** (no production keystore configured on the repo yet). Sideload still works after enabling *Install unknown apps* in Android settings.' }}

            Install:
            1. Download the `.apk` from the Assets section below.
            2. Open it from your file manager, or `adb install <file.apk>`.

            For self-hosting on a server, see the [Docker quick-start](https://github.com/${{ github.repository }}#-self-host-docker) in the README.
